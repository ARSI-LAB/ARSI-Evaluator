schemaVersion: 2
workflow: benchmark.evaluate
with:
  # 官方解析 JSON + simpleagent 的 Ray 调度示例，不是纯图片输入测评。
  # 每个节点需要 HF_TOKEN、相同 HF_ENDPOINT、Docker 和完整的 1,435 份 JSON 缓存空间。
  services:
    default:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      apiKeyEnv: MODEL_API_KEY
  benchmark:
    name: officeqa-pro-v2
    config:
      hfToken: { credential: HF_TOKEN }
      corpusFormat: parsed-json
  scheduler:
    name: ray
    concurrency: 2
output:
  directory: ../../results/officeqa-pro-v2/officeqa-pro-v2-parsed-json-ray
