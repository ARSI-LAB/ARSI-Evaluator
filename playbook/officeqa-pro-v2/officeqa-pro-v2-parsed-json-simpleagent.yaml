# 官方解析 JSON + simpleagent；可检索文本和表格，不是纯图片输入测评。
# 全量运行 90 题，准备完整的 1,435 份 JSON（约 794MB），需要已获授权的 HF_TOKEN。
services:
  default:
    model: ${MODEL_NAME}
    base_url: ${MODEL_ENDPOINT}
    api_key: ${MODEL_API_KEY}
benchmark:
  name: officeqa-pro-v2
  config:
    hfToken: ${HF_TOKEN}
    corpusFormat: parsed-json
