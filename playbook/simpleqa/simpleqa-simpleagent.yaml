schemaVersion: 2
workflow: benchmark.evaluate
with:
  # 除被测模型外，还需设置 JUDGE_MODEL_NAME、JUDGE_MODEL_ENDPOINT、JUDGE_MODEL_API_KEY。
  services:
    default:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      apiKeyEnv: MODEL_API_KEY
    judge:
      model: ${JUDGE_MODEL_NAME}
      base_url: ${JUDGE_MODEL_ENDPOINT}
      apiKeyEnv: JUDGE_MODEL_API_KEY
  benchmark:
    name: simpleqa
    config:
      judgeService: judge
  environment: local
output:
  directory: ../../results/simpleqa/simpleqa-simpleagent
