services:
  default:
    model: ${MODEL_NAME}
    base_url: ${MODEL_ENDPOINT}
    api_key: ${MODEL_API_KEY}
benchmark:
  name: workbuddy
  scenario: office
  solver:
    name: agentbundle
    config:
      path: ../../../pi/bundles/pi
      pi:
        settings:
          version: 1
          office:
            enabled: true
            readOnly: false
run:
  includeTaskAnswer: true
