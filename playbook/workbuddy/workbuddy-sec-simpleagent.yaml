schemaVersion: 2
workflow: benchmark.evaluate
with:
  # Security 请在 Linux / WSL 运行，默认缓存位于 Linux 原生用户目录。
  services:
    default:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      apiKeyEnv: MODEL_API_KEY
  benchmark:
    name: workbuddy
    scenario: security
output:
  directory: ../../results/workbuddy/workbuddy-sec-simpleagent
