schemaVersion: 2
workflow: benchmark.evaluate
with:
  # Web 默认使用 default 服务作为裁判；可通过 benchmark.verifier.service 指定独立服务。
  services:
    default:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      apiKeyEnv: MODEL_API_KEY

  benchmark:
    name: workbuddy
    scenario: web
output:
  directory: ../../results/workbuddy/workbuddy-web
