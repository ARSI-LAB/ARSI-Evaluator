schemaVersion: 2
workflow: benchmark.evaluate
with:
  services:
    default:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      apiKeyEnv: MODEL_API_KEY
  benchmark:
    name: workbuddy
    scenario: code
  scheduler:
    name: ray
    concurrency: 2
output:
  directory: ../../results/workbuddy/workbuddy-code-ray
