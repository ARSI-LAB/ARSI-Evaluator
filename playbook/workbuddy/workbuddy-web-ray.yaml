schemaVersion: 2
workflow: benchmark.evaluate
with:
  services:
    default:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      apiKeyEnv: MODEL_API_KEY
    judge:
      model: ${JUDGE_MODEL_NAME}
      base_url: ${JUDGE_MODEL_ENDPOINT}
      apiKeyEnv: JUDGE_MODEL_API_KEY
  benchmark:
    name: workbuddy
    scenario: web
    verifier:
      service: judge
  scheduler:
    name: ray
    concurrency: 2
output:
  directory: ../../results/workbuddy/workbuddy-web-ray
