# AgentX performance with msprof service-level profiling telemetry.
# msprof is opt-in; requires host/toolbox with CANN msprof binary.
# See docs/design/2026-11-24/msprof-service-profiling-applicability.md
services:
  default:
    model: ${MODEL_NAME}
    base_url: ${MODEL_ENDPOINT}
    api_key: ${MODEL_API_KEY}
benchmark:
  name: agentx
  scenario: standard
  config:
    variant: 256k
    concurrency: [1, 4, 8]
  solver:
    config:
      tokenizer: ${MODEL_NAME}
      trustRemoteCode: false
      telemetry:
        vllm:
          endpoint: ${VLLM_METRICS_ENDPOINT}
        ascend:
          mode: local
          devices:
            - deviceId: 0
            - deviceId: 1
            - deviceId: 2
            - deviceId: 3
        msprof:
          devices:
            - deviceId: 0
            - deviceId: 1
            - deviceId: 2
            - deviceId: 3
          freqHz: 10
          metrics: ArithmeticUtilization
environment: local
