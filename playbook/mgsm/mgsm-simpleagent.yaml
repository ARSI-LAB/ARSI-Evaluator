schemaVersion: 2
workflow: benchmark.evaluate
with:
  # 全量运行 MGSM 的 11 种语言题目。
  services:
    default:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      apiKeyEnv: MODEL_API_KEY
  benchmark:
    name: mgsm
  environment: local
output:
  directory: ../../results/mgsm/mgsm-simpleagent
