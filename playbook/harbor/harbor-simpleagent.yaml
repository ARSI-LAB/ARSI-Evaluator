schemaVersion: 2
workflow: benchmark.evaluate
with:
  # Harbor 是任务协议；本例使用 Terminal-Bench 2.0，可将 dataset 改为其他 Harbor 注册数据集。
  # 需要 Docker，MODEL_ENDPOINT 必须可从容器访问。
  services:
    default:
      model: ${MODEL_NAME}
      base_url: ${MODEL_ENDPOINT}
      apiKeyEnv: MODEL_API_KEY
  benchmark:
    name: harbor
    config:
      dataset: terminal-bench@2.0
output:
  directory: ../../results/harbor/harbor-simpleagent
